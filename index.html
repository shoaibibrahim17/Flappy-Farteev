<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Fart-eev</title>
    <link rel="icon" href="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="> <!-- Transparent favicon to prevent 404 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="game-title">
            <span class="c1">Fla</span><span class="c2">ppy</span> <span class="c3">Fa</span><span class="c4">rt-</span><span class="c5">ee</span><span class="c6">v</span>
        </div>
        <canvas id="game-canvas" width="360" height="640"></canvas>
        
        <div id="score-display">0</div>

        <div id="start-menu" class="popup-container">
            <div class="popup-content">
                <h1>Flappy Fart-eev</h1>
                <p>Click, tap, or press Space to fly!</p>
                <button id="start-button">Start Game</button>
            </div>
        </div>

        <div id="game-over-menu" class="popup-container" style="display: none;">
            <div class="popup-content">
                <h2>Game Over</h2>
                <p>Final Score: <span id="final-score">0</span></p>
                <p>Coins Collected: <span id="collected-coins-display">0</span></p>
                <p>Best Score: <span id="best-score">0</span></p>
                <p id="roast-text"></p>
                <button id="restart-button">Restart</button>
                <button id="share-screenshot-button" style="margin-top: 10px;">Share Screenshot</button>
            </div>
        </div>


    </div>

    <script src="game.js"></script>
    <audio id="continuous-background-music" src="assets/background_music.mp3" loop preload="auto"></audio>
</body>
</html>
